plugins {
    id 'com.android.application'
}

// release signing — credentials live in ../keystore.properties (not in git)
def ksProps = new Properties()
def ksFile = file('../keystore.properties')
if (ksFile.exists()) ksProps.load(new FileInputStream(ksFile))

android {
    namespace 'com.masterseye.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.masterseye.app"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "1.3.0"
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file("../" + ksProps['storeFile'])
                storePassword ksProps['storePass']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPass']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // without a keystore the release APK would be unsigned and uninstallable,
            // so fall back to the debug key until keystore secrets are configured
            if (ksFile.exists()) signingConfig signingConfigs.release
            else signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.12.1'
}
