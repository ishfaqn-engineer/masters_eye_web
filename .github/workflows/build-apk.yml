name: Build APK

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run typecheck

      - name: Build web bundle
        run: npm run build

      - name: Copy web bundle into Android assets
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r dist/. android/app/src/main/assets/www/

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          set -e
          sdkmanager=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" \
            -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)
          echo "using $sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          yes | "$sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Restore release keystore (optional)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          KS_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_STORE_PASS }}
          KS_KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_KEY_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            name="${KS_FILE:-release.jks}"
            printf '%s' "$KS_B64" | base64 -d > "android/$name"
            {
              printf 'storeFile=%s\n' "$name"
              printf 'storePass=%s\n' "$KS_STORE_PASS"
              printf 'keyAlias=%s\n' "$KS_KEY_ALIAS"
              printf 'keyPass=%s\n' "$KS_KEY_PASS"
            } > android/keystore.properties
          else
            echo "No keystore secrets set - signing with the debug key."
          fi

      - name: Assemble release APK
        run: gradle -p android assembleRelease

      - name: Name the APK
        run: |
          d=android/app/build/outputs/apk/release
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            name="TheMastersEye-${GITHUB_REF_NAME}.apk"
          else
            name="TheMastersEye-v2.2.0.apk"
          fi
          mv "$d/app-release.apk" "$d/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: masters-eye-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.2.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.2.0' }}
          target_commitish: ${{ github.sha }}
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
